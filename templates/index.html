<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>테트리스 백트래킹 시각화 · 생활 속 알고리즘</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- ============ 0. 로그인 화면 ============ -->
  <section id="screen-login" class="screen home">
    <div class="home-card login-card">
      <div class="home-logo">TB</div>
      <h1>테트리스 백트래킹</h1>
      <p class="login-sub">기록은 아이디별로 저장됩니다.</p>
      <form id="loginForm" class="login-form" autocomplete="off">
        <input id="loginUser" class="login-input" type="text" placeholder="아이디"
               maxlength="20" autocomplete="username" />
        <input id="loginPass" class="login-input" type="password" placeholder="비밀번호"
               maxlength="40" autocomplete="current-password" />
        <p id="loginError" class="login-error"></p>
        <div class="login-btns">
          <button type="submit" id="loginSubmit" class="big-btn primary">로그인</button>
          <button type="button" id="registerSubmit" class="big-btn">회원가입</button>
        </div>
      </form>
    </div>
  </section>

  <!-- ============ 1. 메인(홈) 화면 ============ -->
  <section id="screen-home" class="screen home hidden">
    <div class="home-card">
      <div class="home-logo">TB</div>
      <h1>테트리스 백트래킹</h1>
      <p class="home-user" id="homeUser"></p>
      <div class="home-btns">
        <button id="homePlay" class="big-btn primary">▶ 플레이</button>
        <button id="homeCustom" class="big-btn">커스텀</button>
        <button id="homeRecords" class="big-btn">🏆 기록</button>
        <button id="homeLogout" class="big-btn">로그아웃</button>
        <button id="homeExit" class="big-btn danger">종료</button>
      </div>
    </div>
  </section>

  <!-- ============ 2. 스테이지 선택 화면 ============ -->
  <section id="screen-stages" class="screen hidden">
    <header class="screen-head">
      <button class="icon-btn" id="stagesBack">← 홈</button>
      <h2>스테이지 선택</h2>
      <span class="head-spacer"></span>
    </header>

    <!-- 페이지(난이도)별 별 1~5개 표시 -->
    <div class="page-stars" id="pageStars" aria-label="난이도"></div>

    <!-- 화면 중앙 좌/우 화살표로 페이지(난이도) 이동 -->
    <div class="stage-pager">
      <button class="pager-arrow" id="pagePrev" aria-label="이전 난이도">‹</button>
      <div id="stageGrid" class="stage-grid"></div>
      <button class="pager-arrow" id="pageNext" aria-label="다음 난이도">›</button>
    </div>

    <div class="page-indicator" id="pageIndicator"></div>
  </section>

  <!-- ============ 3. 게임 화면 ============ -->
  <section id="screen-game" class="screen hidden">
    <header class="screen-head">
      <button class="icon-btn" id="gameBack">← 스테이지</button>
      <h2 id="gameTitle">스테이지</h2>
      <span id="modeBadge" class="mode-badge">직접</span>
    </header>

    <main class="layout">
      <section class="board-col">
        <div class="playfield">
          <aside class="key-guide">
            <h3>키</h3>
            <div><b>←</b><span>왼쪽</span></div>
            <div><b>→</b><span>오른쪽</span></div>
            <div><b>↑</b><span>회전</span></div>
            <div><b>Space</b><span>내려놓기</span></div>
            <div><b>R</b><span>다시 시작</span></div>
            <div><b>B</b><span>모드 변경</span></div>
            <p id="manualResult" class="manual-result"></p>
          </aside>

          <div class="board-wrap" id="boardWrap">
            <canvas id="board"></canvas>
            <div id="banner" class="banner hidden"></div>

            <!-- 클리어 후 오버레이 -->
            <div id="clearOverlay" class="overlay hidden">
              <div class="overlay-card">
                <div class="overlay-emoji" id="overlayEmoji">🎉</div>
                <h2 id="overlayTitle">스테이지 클리어!</h2>
                <p id="overlayStats" class="overlay-stats"></p>
                <div class="overlay-btns">
                  <button id="ovNext" class="btn primary">다음 스테이지 →</button>
                  <button id="ovRetry" class="btn">↺ 다시하기</button>
                  <button id="ovHome" class="btn">🏠 홈</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="info-col">
        <!-- AI 모드 컨트롤 -->
        <div id="aiControls" class="panel">
          <div class="btn-row">
            <button id="btnSolve" class="btn primary">▶ 탐색 시작</button>
            <button id="btnSolution" class="btn">🏁 정답만 재생</button>
            <label class="check"><input type="checkbox" id="pruneToggle" checked /> 가지치기</label>
          </div>
          <div class="speed">
            <span>배속</span>
            <input type="range" id="speed" min="0.5" max="4" step="0.5" value="1" />
            <span id="speedLabel" class="speed-val">1.0x</span>
          </div>
          <div class="scrub">
            <input type="range" id="scrubber" min="0" max="0" value="0" />
            <span id="frameLabel" class="frame-label">0 / 0</span>
          </div>
        </div>
        <div class="card">
          <h3>블록 대기열 (Queue)</h3>
          <div id="queueStrip" class="queue-strip"></div>
        </div>
        <div class="card">
          <h3>탐색 통계</h3>
          <div class="stats-grid">
            <div class="stat"><span class="k">탐색 노드</span><span class="v" id="stNodes">0</span></div>
            <div class="stat"><span class="k">역추적</span><span class="v" id="stBack">0</span></div>
            <div class="stat"><span class="k">가지치기</span><span class="v" id="stPrune">0</span></div>
            <div class="stat"><span class="k">현재 깊이</span><span class="v" id="stDepth">-</span></div>
          </div>
          <div id="pruneCompare" class="prune-compare hidden"></div>
        </div>
        <div class="card">
          <h3>범례</h3>
          <ul class="legend">
            <li><span class="sw try"></span> 시도(trying) — 일반 색</li>
            <li><span class="sw red"></span> 역추적/가지치기 — 빨강</li>
            <li><span class="sw green"></span> 줄 제거/정답 — 초록</li>
            <li><span class="sw gray"></span> 가비지(미리 깔린 블록)</li>
          </ul>
        </div>
      </aside>
    </main>
  </section>

  <!-- ============ 기록 화면 ============ -->
  <section id="screen-records" class="screen hidden">
    <header class="screen-head">
      <button class="icon-btn" id="recordsBack">← 홈</button>
      <h2>🏆 기록</h2>
      <button class="icon-btn danger" id="recordsReset">기록 초기화</button>
    </header>
    <div id="recordsList" class="records-list"></div>
  </section>

  <script src="{{ url_for('static', filename='js/util.js') }}"></script>
  <script src="{{ url_for('static', filename='js/board.js') }}"></script>
  <script src="{{ url_for('static', filename='js/player.js') }}"></script>
  <script src="{{ url_for('static', filename='js/manual.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
